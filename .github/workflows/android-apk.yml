name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile test APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: forma-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # OTA updates require a single persistent private signing key.
      # Set these 4 GitHub Actions secrets to enable the signed release build.
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FORMA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORMA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORMA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/forma-release.jks"
            echo "FORMA_SIGNING_STORE_FILE=$RUNNER_TEMP/forma-release.jks" >> "$GITHUB_ENV"
            echo "FORMA_SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FORMA_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FORMA_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FORMA_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "FORMA_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Signed release skipped: configure four FORMA_* secrets to activate it"
          fi
      - name: Build signed release APK
        if: env.FORMA_SIGNING_READY == 'true'
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: env.FORMA_SIGNING_READY == 'true'
        with:
          name: forma-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
