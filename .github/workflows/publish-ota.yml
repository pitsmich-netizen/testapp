name: Publish signed OTA release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'What changed in this version'
        required: false
        default: 'Ulepszenia dziennika treningowego.'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.release-requests/forma-0.10.15.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OTA downloader and FileProvider paths
        run: python3 scripts/verify_ota_paths.py
      - name: Verify rest timer and data compatibility
        run: python3 scripts/verify_timer_integration.py
      - name: Validate v0.7 database migration and backup
        run: python3 scripts/verify_forma_07.py
      - name: Validate v0.8 schedule, backup and workout UX
        run: python3 scripts/verify_forma_08.py
      - name: Validate FBW 1.0 plan and v9 data migration
        run: python3 scripts/verify_forma_081.py
      - name: Validate v0.8.2 compact workout controls
        run: python3 scripts/verify_forma_082.py
      - name: Validate v0.8.3 compact inline edit and actions
        run: python3 scripts/verify_forma_083.py
      - name: Validate 0.8.4 timer, settings and calendar
        run: python3 scripts/verify_forma_084.py
      - name: Validate quick OTA and refreshed detail screens
        run: python3 scripts/verify_forma_085.py
      - name: Verify FORMA 0.9.0 weekly statistics and data-safe UI
        run: python3 scripts/verify_forma_090.py
      - name: Verify FORMA 0.10.0 intelligent training and test-session safety
        run: python3 scripts/verify_forma_010.py
      - name: Validate FORMA 0.10.1 exercise instructions
        run: python3 scripts/verify_forma_0101.py
      - name: Verify FORMA 0.10.2 preview and explicit start
        run: python3 scripts/verify_forma_0102.py
      - name: Verify FORMA 0.10.3 exercise image atlas
        run: python3 scripts/verify_forma_0103.py
      - name: Verify FORMA 0.10.4 exercise comments and migration
        run: python3 scripts/verify_forma_0104.py
      - name: Verify FORMA 0.10.5 rest notification
        run: python3 scripts/verify_forma_0105.py
      - name: Verify FORMA 0.10.6 status notification and sharp guides
        run: python3 scripts/verify_forma_0106.py
      - name: Verify FORMA 0.10.7 photos and visible notifications
        run: python3 scripts/verify_forma_0107.py
      - name: Verify FORMA 0.10.8 notification cleanup
        run: python3 scripts/verify_forma_0108.py
      - name: Verify FORMA 0.10.9 separate countdown notification
        run: python3 scripts/verify_forma_0109.py
      - name: Verify FORMA 0.10.10 unified notification and app icon
        run: python3 scripts/verify_forma_0110.py
      - name: Verify FORMA 0.10.11 restored rest countdown
        run: python3 scripts/verify_forma_0111.py
      - name: Verify FORMA 0.10.12 session UX and rest transition
        run: python3 scripts/verify_forma_0112.py
      - name: Verify FORMA 0.10.13 per-set RIR history
        run: python3 scripts/verify_forma_0113.py
      - name: Verify FORMA 0.10.14 background resume and Back
        run: python3 scripts/verify_forma_0114.py
      - name: Verify FORMA 0.10.15 RIR trend and missing-data safety
        run: python3 scripts/verify_forma_0115.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)
          if [[ -z "$SDKMANAGER" ]]; then echo "::error::Missing Android sdkmanager"; exit 1; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FORMA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORMA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORMA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more FORMA signing secrets. Configure them before publishing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/forma-release.jks"
          {
            echo "FORMA_SIGNING_STORE_FILE=$RUNNER_TEMP/forma-release.jks"
            echo "FORMA_SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FORMA_SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "FORMA_SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Read and validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo "::error::Cannot read version from app/build.gradle"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Gradle version v$VERSION_NAME"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Build signed APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Create manifest
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/forma-v$VERSION_NAME.apk"
          python3 scripts/create_ota_manifest.py "dist/forma-v$VERSION_NAME.apk" "$VERSION_CODE" "$VERSION_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION_NAME/forma-v$VERSION_NAME.apk"
          if [[ -n "$RELEASE_NOTES" ]]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("dist/latest.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          data["notes"]=os.environ["RELEASE_NOTES"]
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Increase versionCode and versionName."
            exit 1
          fi
          gh release create "$TAG" "dist/forma-v$VERSION_NAME.apk" "dist/latest.json" \
            --title "FORMA $VERSION_NAME" --notes "Aktualizacja aplikacji FORMA. Zainstaluj podpisany APK." --latest --target "$GITHUB_SHA"
